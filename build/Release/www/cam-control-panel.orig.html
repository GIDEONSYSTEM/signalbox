<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Control — OBS Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ok:#41d67e; --warn:#ffc24b; --crit:#ff4d4d; --idle:#7d8794;
    --bg:#0a0d11; --panel:#12161c; --panel-2:#161b22;
    --edge:rgba(255,255,255,.09); --edge-2:rgba(255,255,255,.06);
    --ink:#eef2f6; --ink-dim:#94a0ac;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --ui:"Saira",system-ui,sans-serif; --cond:"Saira Condensed","Saira",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:var(--ui); color:var(--ink);
    background:
      radial-gradient(900px 500px at 80% -20%, #182230 0%, var(--bg) 60%),
      var(--bg);
  }
  body::before{ /* лёгкая текстура для глубины */
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.4;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:40px 40px;
  }
  #app{position:relative; padding:14px; max-width:420px; margin:0 auto; display:flex; flex-direction:column; gap:11px;}

  /* header */
  .head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 2px;}
  .title{font-weight:700; letter-spacing:.14em; font-size:13px; text-transform:uppercase; color:var(--ink-dim);}
  .badge{display:flex; align-items:center; gap:6px; font-family:var(--cond); font-weight:600;
         letter-spacing:.1em; font-size:10px; text-transform:uppercase;}
  .badge .d{width:7px;height:7px;border-radius:50%;}
  .badge.demo{color:var(--warn)} .badge.demo .d{background:var(--warn)}
  .badge.live{color:var(--ok)}   .badge.live .d{background:var(--ok); box-shadow:0 0 8px var(--ok)}

  /* master row */
  .master{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .mbtn{font-family:var(--ui); font-weight:700; letter-spacing:.08em; text-transform:uppercase;
        font-size:13px; padding:13px 10px; border-radius:11px; cursor:pointer; border:1px solid var(--edge);
        background:var(--panel-2); color:var(--ink); transition:.15s; user-select:none;
        display:flex; align-items:center; justify-content:center; gap:8px;}
  .mbtn:hover{border-color:rgba(255,255,255,.2);}
  .mbtn:active{transform:translateY(1px);}
  .mbtn .ic{width:11px;height:11px;border-radius:50%;}
  .mbtn.roll{color:var(--ok); border-color:rgba(65,214,126,.4); background:rgba(65,214,126,.08);}
  .mbtn.roll .ic{background:var(--ok);}
  .mbtn.stop{color:var(--crit); border-color:rgba(255,77,77,.35); background:rgba(255,77,77,.07);}
  .mbtn.stop .ic{background:var(--crit); border-radius:2px;}
  .mbtn.confirming{animation:pulse .9s infinite; background:var(--crit); color:#fff; border-color:var(--crit);}
  .mbtn.confirming .ic{background:#fff;}
  @keyframes pulse{50%{opacity:.62}}

  /* camera cards */
  .card{background:var(--panel); border:1px solid var(--edge); border-radius:13px; padding:12px 13px;
        position:relative; overflow:hidden;
        opacity:0; transform:translateY(8px); animation:in .45s cubic-bezier(.2,.8,.2,1) forwards;}
  .card:nth-child(3){animation-delay:.05s}
  .card:nth-child(4){animation-delay:.11s}
  .card:nth-child(5){animation-delay:.17s}
  @keyframes in{to{opacity:1;transform:none}}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--idle); transition:.35s;}
  .card.rec::before{background:var(--crit); box-shadow:0 0 12px var(--crit);}

  .crow{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .cam{font-weight:700; letter-spacing:.05em; font-size:18px; text-transform:uppercase;}
  .model{font-family:var(--cond); font-weight:600; letter-spacing:.04em; font-size:10px;
         color:var(--ink-dim); text-transform:uppercase; margin-top:3px;}
  .state{display:flex; align-items:center; gap:6px; font-family:var(--cond); font-weight:700;
         letter-spacing:.12em; font-size:12px; color:var(--idle);}
  .state .dot{width:9px;height:9px;border-radius:50%; background:var(--idle);}
  .card.rec .state{color:var(--crit);}
  .card.rec .state .dot{background:var(--crit); animation:pulse 1.1s infinite; box-shadow:0 0 9px var(--crit);}

  .controls{display:flex; gap:10px; align-items:stretch;}

  /* REC button */
  .rec-btn{flex:0 0 116px; border-radius:10px; cursor:pointer; user-select:none;
           border:1.5px solid rgba(65,214,126,.5); background:rgba(65,214,126,.08); color:var(--ok);
           font-family:var(--ui); font-weight:700; letter-spacing:.07em; text-transform:uppercase; font-size:13px;
           display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s;}
  .rec-btn:hover{filter:brightness(1.12);}
  .rec-btn:active{transform:translateY(1px);}
  .rec-btn .ic{width:11px;height:11px;border-radius:50%;background:var(--ok);}
  .card.rec .rec-btn{border-color:var(--crit); background:rgba(255,77,77,.12); color:var(--crit);}
  .card.rec .rec-btn .ic{background:var(--crit);border-radius:50%;}
  .rec-btn.confirming{background:var(--crit); color:#fff; border-color:var(--crit); animation:pulse .9s infinite;}
  .rec-btn.confirming .ic{background:#fff;}
  .rec-btn.pending{opacity:.55; pointer-events:none;}

  /* ISO block */
  .iso{flex:1; background:var(--panel-2); border:1px solid var(--edge-2); border-radius:10px;
       padding:7px 9px; display:flex; flex-direction:column; gap:5px;}
  .iso-top{display:flex; align-items:baseline; justify-content:space-between;}
  .iso-lab{font-family:var(--cond); font-weight:600; letter-spacing:.1em; font-size:10px; color:var(--ink-dim); text-transform:uppercase;}
  .iso-eff{font-family:var(--mono); font-weight:700; font-size:10px; color:var(--ink-dim);}
  .iso-row{display:flex; align-items:center; gap:6px;}
  .step{flex:none; width:26px; height:26px; border-radius:7px; border:1px solid var(--edge);
        background:#1c222b; color:var(--ink); font-family:var(--mono); font-weight:800; font-size:15px;
        cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none;}
  .step:hover{border-color:rgba(255,255,255,.25);}
  .step:active{transform:translateY(1px);}
  .iso-sel{flex:1; appearance:none; -webkit-appearance:none; text-align:center;
           background:#1c222b; border:1px solid var(--edge); border-radius:7px; color:var(--ink);
           font-family:var(--mono); font-weight:800; font-size:15px; padding:4px 6px; cursor:pointer;}
  .iso-sel:focus{outline:none; border-color:rgba(255,255,255,.3);}

  .hint{text-align:center; font-family:var(--cond); font-weight:500; letter-spacing:.06em;
        font-size:10px; color:var(--ink-dim); opacity:.7; padding-top:2px;}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="title">Пульт камер</div>
    <div class="badge" id="badge"><span class="d"></span><span class="t">…</span></div>
  </div>
  <div class="master">
    <div class="mbtn roll" id="rollAll"><span class="ic"></span>Запись · все</div>
    <div class="mbtn stop" id="stopAll"><span class="ic"></span>Стоп · все</div>
  </div>
  <!-- карточки камер добавятся скриптом -->
  <div class="hint">Стоп записи требует второго нажатия (защита от случайного клика)</div>
</div>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const CONFIG = {
  statusEndpoint: "http://127.0.0.1:8787/status.json", // откуда читаем состояние (REC, ISO)
  cmdEndpoint:    "http://127.0.0.1:8787/cmd",          // куда шлём команды (POST)
  pollMs: 1000,
  confirmMs: 2500,   // окно подтверждения для «стоп»

  cameras: [
    { id:"CAM 1", model:"Sony ZV-E1"     },
    { id:"CAM 2", model:"Sony ZV-E1"     },
    { id:"CAM 3", model:"Sony ZV-E10 II" },
  ],

  // Допустимые значения ISO для выпадающего списка (в бою тянутся с камеры).
  isoValues: ["AUTO",100,160,200,320,400,640,800,1250,1600,2500,3200,5000,6400,12800,25600,51200,102400],
};

/* ---------- состояние ---------- */
let live = false;
let state = CONFIG.cameras.map((c,i)=>({
  online:true,
  rec:[true,true,false][i] ?? false,
  iso:[ "AUTO", 800, 3200 ][i] ?? 800,   // строка "AUTO" или число
  isoEff:[1600,800,3200][i] ?? 800,      // эффективное ISO (для показа в AUTO)
}));
const confirm = { all:false, cam:{} };   // флаги подтверждения «стоп»

/* ---------- построение карточек ---------- */
const app = document.getElementById('app');
const hint = app.querySelector('.hint');
const els = CONFIG.cameras.map((c,i)=>{
  const card = document.createElement('div');
  card.className = 'card';
  const opts = CONFIG.isoValues.map(v=>`<option value="${v}">${v==="AUTO"?"АВТО":v}</option>`).join('');
  card.innerHTML = `
    <div class="crow">
      <div><div class="cam">${c.id}</div><div class="model">${c.model}</div></div>
      <div class="state"><span class="dot"></span><span class="lab">STBY</span></div>
    </div>
    <div class="controls">
      <div class="rec-btn"><span class="ic"></span><span class="t">ЗАПИСЬ</span></div>
      <div class="iso">
        <div class="iso-top"><span class="iso-lab">ISO</span><span class="iso-eff"></span></div>
        <div class="iso-row">
          <div class="step minus">−</div>
          <select class="iso-sel">${opts}</select>
          <div class="step plus">+</div>
        </div>
      </div>
    </div>`;
  app.insertBefore(card, hint);
  const e = {
    card,
    stateLab: card.querySelector('.state .lab'),
    recBtn:   card.querySelector('.rec-btn'),
    recTxt:   card.querySelector('.rec-btn .t'),
    isoSel:   card.querySelector('.iso-sel'),
    isoEff:   card.querySelector('.iso-eff'),
    minus:    card.querySelector('.step.minus'),
    plus:     card.querySelector('.step.plus'),
  };
  // обработчики
  e.recBtn.onclick = ()=>onRec(i);
  e.isoSel.onchange = ()=>setIso(i, e.isoSel.value);
  e.minus.onclick = ()=>stepIso(i,-1);
  e.plus.onclick  = ()=>stepIso(i,+1);
  return e;
});
document.getElementById('rollAll').onclick = ()=>{ confirm.all=false; renderMaster(); cmd({cam:"all",action:"rec",value:"start"}); };
document.getElementById('stopAll').onclick = onStopAll;

/* ---------- команды ---------- */
async function cmd(payload){
  try{
    const r = await fetch(CONFIG.cmdEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok) throw 0;
    // успех: реальное состояние подтянется следующим опросом status.json
  }catch(_){
    applyDemo(payload);   // сборщика нет → имитируем эффект локально
  }
}

/* ---------- REC ---------- */
function onRec(i){
  const s = state[i];
  if(!s.rec){                                   // старт — сразу
    pending(i); cmd({cam:i+1,action:"rec",value:"start"});
  }else if(confirm.cam[i]){                     // второе нажатие — стоп
    confirm.cam[i]=false; pending(i); cmd({cam:i+1,action:"rec",value:"stop"});
  }else{                                        // первое нажатие на пишущую — запрос подтверждения
    confirm.cam[i]=true; render();
    clearTimeout(confirm['t'+i]); confirm['t'+i]=setTimeout(()=>{confirm.cam[i]=false; render();}, CONFIG.confirmMs);
  }
}
function onStopAll(){
  const anyRec = state.some(s=>s.rec);
  if(!anyRec) return;
  if(confirm.all){ confirm.all=false; cmd({cam:"all",action:"rec",value:"stop"}); }
  else{ confirm.all=true; renderMaster();
        clearTimeout(confirm.tAll); confirm.tAll=setTimeout(()=>{confirm.all=false; renderMaster();}, CONFIG.confirmMs); }
}
function pending(i){ els[i].recBtn.classList.add('pending'); }

/* ---------- ISO ---------- */
function setIso(i,val){
  const v = val==="AUTO" ? "AUTO" : parseInt(val,10);
  cmd({cam:i+1,action:"iso",value:val});
}
function stepIso(i,dir){
  const vals = CONFIG.isoValues;
  let cur = String(state[i].iso);
  let idx = vals.findIndex(v=>String(v)===cur);
  if(idx<0) idx = vals.indexOf("AUTO");
  let ni = Math.max(0, Math.min(vals.length-1, idx+dir));
  setIso(i, String(vals[ni]));
}

/* ---------- демо-эффекты команд ---------- */
function applyDemo(p){
  const apply = (s)=>{
    if(p.action==="rec"){ s.rec = p.value==="start" ? true : p.value==="stop" ? false : !s.rec; }
    if(p.action==="iso"){ s.iso = p.value==="AUTO" ? "AUTO" : parseInt(p.value,10);
                          if(p.value!=="AUTO") s.isoEff = parseInt(p.value,10); }
  };
  if(p.cam==="all") state.forEach(apply); else apply(state[p.cam-1]);
  els.forEach(e=>e.recBtn.classList.remove('pending'));
  render();
}

/* ---------- рендер ---------- */
function render(){
  state.forEach((s,i)=>{
    const e = els[i];
    e.card.classList.toggle('rec', s.rec);
    e.stateLab.textContent = s.rec ? 'REC' : 'STBY';
    // REC-кнопка
    e.recBtn.classList.toggle('confirming', !!confirm.cam[i]);
    e.recTxt.textContent = confirm.cam[i] ? 'СТОП?' : s.rec ? '● ЗАП' : 'ЗАПИСЬ';
    // ISO
    const isoStr = String(s.iso);
    if(e.isoSel.value !== isoStr) e.isoSel.value = isoStr;
    e.isoEff.textContent = s.iso==="AUTO" ? `эфф. ${s.isoEff}` : '';
  });
  renderMaster();
}
function renderMaster(){
  const stopBtn = document.getElementById('stopAll');
  stopBtn.classList.toggle('confirming', confirm.all);
  stopBtn.querySelector('.ic')?.parentNode && (stopBtn.childNodes[1].nodeValue = confirm.all ? 'Подтвердить' : 'Стоп · все');
}

/* ---------- опрос состояния ---------- */
function setBadge(){
  const b = document.getElementById('badge');
  b.className = 'badge ' + (live?'live':'demo');
  b.querySelector('.t').textContent = live ? 'live' : 'демо';
}
async function poll(){
  try{
    const r = await fetch(CONFIG.statusEndpoint,{cache:'no-store'});
    if(!r.ok) throw 0;
    const data = await r.json();
    (data.cameras||[]).forEach((d,i)=>{
      if(!state[i]) return;
      state[i].online = d.online!==false;
      state[i].rec    = !!d.rec;
      if(d.iso!==undefined)    state[i].iso = d.iso;
      if(d.isoEff!==undefined) state[i].isoEff = d.isoEff;
    });
    els.forEach(e=>e.recBtn.classList.remove('pending'));
    live = true; setBadge(); render();
  }catch(_){
    live = false; setBadge();
    if(!live) render();   // демо: показываем локальное состояние
  }
}
render(); poll();
setInterval(poll, CONFIG.pollMs);
</script>
</body>
</html>
